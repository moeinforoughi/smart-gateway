name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04, arch: arm64 }
          - { os: debian-13 }
          - { os: rocky-10 }
    runs-on: ${{ matrix.os == 'rocky-10' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Unit tests with race detector (NFR-123)
        run: go test -race -count=1 ./...
      - name: go vet (NFR-124)
        run: go vet ./...
      - name: gofmt check (NFR-126)
        run: test -z "$(gofmt -l .)"
      - name: Build amd64/arm64 (NFR-241)
        run: make cross-build
      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-gateway-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint (NFR-125)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  arch:
    name: Architecture import rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Enforce dependency direction (architecture §3)
        run: go run ./scripts/archcheck
